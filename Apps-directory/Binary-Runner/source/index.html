<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b1822">
<title>Binary Runner</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
<script src="runner.js" defer></script>
</head><body>
<header><strong>Binary Runner</strong><span class="version">1.0.8</span></header>
<main>
 <label for="choice">Binary</label>
 <button type="button" id="choice" aria-label="Binary to stage" disabled>Loading...</button>
 <div class="meta" id="detail">Select a binary.</div>
 <div class="status" id="status" role="status" aria-live="polite">Loading...</div>
 <section><h2>Recent logs</h2><pre id="log" aria-label="Recent logs" role="log">Ready.</pre></section>
 <div class="actions">
  <button type="button" id="stage" disabled>Stage binary</button>
  <button type="button" id="restore">Restore stock updater</button>
  <button type="button" id="inspect">Check status</button>
  <button type="button" id="debug">Install debug XPI</button>
  <button type="button" id="refresh-logs">Read logs</button>
 </div>
</main>
<footer><span id="soft-left">Binary</span><strong>OK</strong><span id="soft-right">Logs</span></footer>
</body></html>
